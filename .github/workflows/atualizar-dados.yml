name: Atualizar dados

# 09:00 UTC = 06:00 America/Sao_Paulo (o Brasil não usa horário de verão).
on:
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    environment: NOXXON_PASSWORD
    timeout-minutes: 120
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Exigir segredos
        env:
          NOXXON_PASSWORD: ${{ secrets.NOXXON_PASSWORD }}
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
        run: |
          set -euo pipefail
          missing=0
          if [ -z "${NOXXON_PASSWORD}" ]; then
            echo "Segredo ausente: NOXXON_PASSWORD"
            missing=1
          fi
          if [ -z "${JOTFORM_API_KEY}" ]; then
            echo "Segredo ausente: JOTFORM_API_KEY"
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Interrompido antes da coleta. Os JSON publicados não serão alterados."
            exit 1
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          python -m pip install -r requirements.txt

      - name: Coletar e exportar
        env:
          NOXXON_EMAIL: leticia@noxxonsat.com.br
          NOXXON_PASSWORD: ${{ secrets.NOXXON_PASSWORD }}
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          JOTFORM_SHARE_URL: ${{ secrets.JOTFORM_SHARE_URL }}
        run: python scripts/refresh_pipeline.py

      - name: Publicar JSON no main
        id: commit
        run: |
          set -euo pipefail
          git checkout -- generate_report.py scripts/generate_retorno_switch.py scripts/collect_status_api.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            web/data/datasets \
            web/data/web_status.json \
            data/web \
            data/web_status.json \
            data/jotform/historico.json
          if compgen -G "web/public/pdfs/*.pdf" > /dev/null; then
            git add -- web/public/pdfs
          fi
          if git diff --cached --name-only | grep -E '\.(py|yml|ts|tsx|mjs)$'; then
            echo "Recusando commit que inclui código."
            exit 1
          fi
          python - << 'PY'
          import json
          from pathlib import Path
          for name in ("executivo", "santa", "sdcard", "conexao", "retorno"):
              path = Path("web/data/datasets") / f"{name}.json"
              data = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(data, dict) or not data:
                  raise SystemExit(f"dataset vazio: {path}")
          exec_n = int(json.loads(Path("web/data/datasets/executivo.json").read_text())["kpis"]["maintenances"])
          if exec_n < 1690:
              raise SystemExit(f"executivo com {exec_n} manutenções; o histórico exige >= 1690")
          history = json.loads(Path("data/jotform/historico.json").read_text())
          if not history.get("legacy") or not isinstance(history.get("records"), dict):
              raise SystemExit("histórico Jotform inválido")
          PY
          if git diff --cached --quiet; then
            echo "Nenhuma mudança nos datasets."
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Atualiza os dados do painel (coleta diária)"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  publicar:
    needs: atualizar
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
    with:
      ref: ${{ needs.atualizar.outputs.sha }}
